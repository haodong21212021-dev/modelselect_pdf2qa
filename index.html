<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《崩坏3·后崩坏书》同人系列</title>
    <style>
        :root {
            --bg-color: #0b0d14;
            --card-bg: #151824;
            --text-color: #e2e8f0;
            --accent-purple: #9d4edd;
            --accent-blue: #00b4d8;
            --accent-red: #ff4d6d;
            --border-color: #262b3d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.9;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 25px;
        }
        h1 {
            font-size: 2.3rem;
            color: #fff;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-shadow: 0 0 25px rgba(157, 78, 221, 0.4);
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1.05rem;
        }
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: var(--card-bg);
            color: #94a3b8;
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            font-size: 1.02rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        .tab-btn:hover {
            border-color: var(--accent-purple);
            color: #fff;
            transform: translateY(-2px);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-purple), #7b2cbf);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
        }
        .tab-btn.active.blue {
            background: linear-gradient(135deg, var(--accent-blue), #0077b6);
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.4);
        }
        .tab-btn.active.red {
            background: linear-gradient(135deg, var(--accent-red), #c9184a);
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }
        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: none;
        }
        .content-card.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .novel-text {
            white-space: pre-wrap;
            font-size: 1.08rem;
            letter-spacing: 0.6px;
            color: #e2e8f0;
            word-break: break-word;
        }
        footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px 0;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>《崩坏3·后崩坏书》同人系列</h1>
            <div class="subtitle">男主：黑人德克（BIGDICK） | 极品女武神肉体沦陷全纪实</div>
        </header>

        <div class="nav-tabs">
            <button class="tab-btn" id="btn-mei" onclick="switchTab('mei')">第一篇：雷电芽衣篇（约2.5万字）</button>
            <button class="tab-btn" id="btn-bronya" onclick="switchTab('bronya')">第二篇：布洛妮娅篇（约3.04万字）</button>
            <button class="tab-btn active red" id="btn-seele" onclick="switchTab('seele')">第三篇：白希儿篇（全新设定，约3.52万字）</button>
        </div>

        <div id="tab-mei" class="content-card">
            <div id="text-mei" class="novel-text">加载中...</div>
        </div>

        <div id="tab-bronya" class="content-card">
            <div id="text-bronya" class="novel-text">加载中...</div>
        </div>

        <div id="tab-seele" class="content-card active">
            <div id="text-seele" class="novel-text">加载中...</div>
        </div>

        <footer>
            《崩坏3·后崩坏书》同人作品库 &copy; 2026
        </footer>
    </div>

    <script>
        async function loadContent() {
            try {
                const resMei = await fetch('/api/mei');
                const textMei = await resMei.text();
                document.getElementById('text-mei').innerText = textMei;

                const resBronya = await fetch('/api/bronya');
                const textBronya = await resBronya.text();
                document.getElementById('text-bronya').innerText = textBronya;

                const resSeele = await fetch('/api/seele');
                const textSeele = await resSeele.text();
                document.getElementById('text-seele').innerText = textSeele;
            } catch (e) {
                console.error(e);
            }
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active', 'blue', 'red'));
            document.querySelectorAll('.content-card').forEach(card => card.classList.remove('active'));

            if (type === 'mei') {
                document.getElementById('btn-mei').classList.add('active');
                document.getElementById('tab-mei').classList.add('active');
            } else if (type === 'bronya') {
                document.getElementById('btn-bronya').classList.add('active', 'blue');
                document.getElementById('tab-bronya').classList.add('active');
            } else if (type === 'seele') {
                document.getElementById('btn-seele').classList.add('active', 'red');
                document.getElementById('tab-seele').classList.add('active');
            }
        }

        window.onload = loadContent;
    </script>
</body>
</html>
